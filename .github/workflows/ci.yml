name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # skills/ and docs/best-practices/ frontmatter must match src/skills/generated.ts.
      - name: Skills manifest
        run: pnpm gen:skills --check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Bundles and validates wrangler.jsonc without credentials or uploading anything.
      - name: Build (wrangler dry run)
        run: pnpm exec wrangler deploy --dry-run --outdir dist

  # Codegen drift (pnpm gen:check) runs weekly in gen-check.yml, not on every PR.
